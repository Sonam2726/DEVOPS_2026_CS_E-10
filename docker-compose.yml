services:
  backend:
    build: ./server
    container_name: skillbridge_backend
    restart: always
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/skillbridge
      - JWT_SECRET=skillbridge_jwt_secret_key_2026
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    container_name: skillbridge_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: