services:
  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5001/api
    container_name: skillbridge_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./server
    container_name: skillbridge_backend
    restart: always
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/skillbridge
      - "JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the environment or project .env file}"
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    container_name: skillbridge_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: